<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Orbit Academy — Space Quiz</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --page: #f5f4fb;
      --surface: rgba(255, 255, 255, .86);
      --surface-solid: #fff;
      --ink: #211d3a;
      --muted: #77738d;
      --line: #e8e5f1;
      --purple: #7657e8;
      --purple-dark: #6142d4;
      --purple-soft: #f0edff;
      --teal: #087f75;
      --teal-soft: #e6f7f4;
      --green: #15966a;
      --green-bg: #e6f8ef;
      --red: #d8455f;
      --red-bg: #fff0f2;
      --shadow: 0 24px 70px rgba(48, 36, 100, .12);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #11101c;
        --surface: rgba(29, 27, 44, .9);
        --surface-solid: #201e30;
        --ink: #f5f2ff;
        --muted: #aaa5bf;
        --line: #39354d;
        --purple: #a38bff;
        --purple-dark: #9075f4;
        --purple-soft: #30294c;
        --teal: #67d9c8;
        --teal-soft: #1d3b3a;
        --green: #5ce0a9;
        --green-bg: #18392f;
        --red: #ff8296;
        --red-bg: #482531;
        --shadow: 0 24px 70px rgba(0, 0, 0, .35);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 18px;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 15%, rgba(154, 134, 255, .13), transparent 34%),
        radial-gradient(ellipse at 88% 82%, rgba(77, 201, 202, .10), transparent 30%),
        var(--page);
      font-size: 15px;
      line-height: 1.55;
    }

    .shell { width: min(100%, 520px); }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 4px 20px;
    }

    .brand {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      color: var(--ink);
      font-size: 14px;
      font-weight: 750;
      letter-spacing: -.02em;
    }

    .brand-mark {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border-radius: 12px;
      background: linear-gradient(145deg, #a18bff, #7657e8);
      box-shadow: 0 5px 14px rgba(118, 87, 232, .25);
      font-size: 18px;
    }

    .top-note {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .card::before {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(118, 87, 232, .025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(118, 87, 232, .025) 1px, transparent 1px);
      background-size: 24px 24px;
      content: "";
      pointer-events: none;
    }

    .console-rail {
      position: relative;
      display: flex;
      min-height: 42px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 clamp(20px, 5vw, 34px);
      border-bottom: 1px solid var(--line);
      background: var(--purple-soft);
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .rail-code { color: var(--purple); }

    .system-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--teal);
      white-space: nowrap;
    }

    .status-light {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 0 3px var(--teal-soft), 0 0 10px currentColor;
    }

    .card-inner, .result { position: relative; }
    .card-inner { padding: clamp(24px, 6vw, 38px); }

    .intro {
      display: flex;
      align-items: center;
      gap: 17px;
      margin-bottom: 27px;
    }

    .planet {
      position: relative;
      display: grid;
      flex: 0 0 72px;
      width: 72px;
      height: 72px;
      place-items: center;
      border: 1px solid rgba(130, 105, 235, .15);
      border-radius: 20px;
      background: linear-gradient(145deg, #f3edff, #e6e2ff);
      font-size: 36px;
      animation: float 4s ease-in-out infinite;
    }

    .planet::after {
      position: absolute;
      inset: 7px -5px;
      border: 1px dashed rgba(118, 87, 232, .32);
      border-radius: 50%;
      content: "";
      transform: rotate(-24deg);
      pointer-events: none;
    }

    @media (prefers-color-scheme: dark) {
      .planet { background: linear-gradient(145deg, #362e55, #292742); }
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--purple);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1, h2, p { margin-top: 0; }
    h1 {
      margin-bottom: 4px;
      font-size: clamp(23px, 5vw, 29px);
      line-height: 1.15;
      letter-spacing: -.045em;
    }

    .intro-copy p:last-child { margin-bottom: 0; color: var(--muted); font-size: 14px; }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    .score {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface-solid);
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .progress-track {
      height: 10px;
      overflow: hidden;
      margin-bottom: 29px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background:
        repeating-linear-gradient(90deg, transparent 0, transparent calc(10% - 2px), var(--surface-solid) calc(10% - 2px), var(--surface-solid) 10%),
        var(--line);
    }

    .progress-fill {
      width: 0;
      height: 100%;
      background: linear-gradient(90deg, #9276f4, var(--purple));
      box-shadow: 0 0 10px rgba(118, 87, 232, .45);
      transition: width .45s cubic-bezier(.2, .8, .2, 1);
    }

    .question-number {
      margin-bottom: 9px;
      color: var(--teal);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .question {
      margin: 0 0 22px;
      font-size: clamp(19px, 4vw, 22px);
      line-height: 1.35;
      letter-spacing: -.025em;
    }

    .answers { display: grid; gap: 10px; }

    .answer {
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface-solid);
      color: var(--ink);
      text-align: left;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: border-color .18s ease, background .18s ease, transform .18s ease, box-shadow .18s ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--purple);
      box-shadow: 0 5px 15px rgba(118, 87, 232, .10);
    }

    .answer:focus-visible, .primary:focus-visible {
      outline: 3px solid rgba(118, 87, 232, .38);
      outline-offset: 3px;
    }

    .answer:disabled { cursor: default; }

    .answer-letter {
      display: grid;
      flex: 0 0 28px;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 9px;
      background: var(--purple-soft);
      color: var(--purple);
      font-size: 12px;
      font-weight: 800;
    }

    .answer.correct {
      border-color: var(--green);
      background: var(--green-bg);
      color: var(--green);
      animation: pop .35s ease both;
    }
    .answer.correct .answer-letter { background: var(--green); color: #fff; }
    .answer.incorrect {
      border-color: var(--red);
      background: var(--red-bg);
      color: var(--red);
    }
    .answer.incorrect .answer-letter { background: var(--red); color: #fff; }

    .feedback {
      min-height: 25px;
      margin: 14px 0 0;
      font-size: 13px;
      font-weight: 650;
    }
    .feedback.good { color: var(--green); }
    .feedback.bad { color: var(--red); }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 18px;
    }

    .primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 46px;
      padding: 0 19px;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(135deg, #886cf0, #6e50dc);
      box-shadow: 0 8px 18px rgba(118, 87, 232, .23);
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 750;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .primary:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(118, 87, 232, .32); }
    .primary:active { transform: translateY(0); }

    .result { padding: 44px 30px 42px; text-align: center; }
    .result-emoji {
      display: grid;
      width: 96px;
      height: 96px;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 30px;
      background: var(--purple-soft);
      font-size: 53px;
      animation: float 3s ease-in-out infinite;
    }
    .result h2 {
      margin: 0 0 9px;
      font-size: 29px;
      letter-spacing: -.04em;
    }
    .result-copy { max-width: 330px; margin: 0 auto 22px; color: var(--muted); font-size: 14px; }
    .final-score {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 25px;
      color: var(--purple);
      font-size: 40px;
      font-weight: 850;
      letter-spacing: -.06em;
    }
    .final-score span { color: var(--muted); font-size: 15px; font-weight: 650; letter-spacing: 0; }
    .result .primary { margin: 0 auto; }
    [hidden] { display: none !important; }

    .shake { animation: shake .42s ease; }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-6px) rotate(2deg); }
    }
    @keyframes pop {
      0% { transform: scale(.97); }
      65% { transform: scale(1.015); }
      100% { transform: scale(1); }
    }
    @keyframes shake {
      15%, 55%, 95% { transform: translateX(-6px); }
      35%, 75% { transform: translateX(6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">🚀</span> Orbit Academy</div>
      <div class="top-note"><span aria-hidden="true">✦</span> Cosmic knowledge, one question at a time</div>
    </header>

    <section class="card" aria-label="Space exploration quiz">
      <div class="console-rail">
        <span class="rail-code">Flight deck <span aria-hidden="true">/</span> Orbital survey</span>
        <span class="system-status"><span class="status-light" aria-hidden="true"></span> Ready for launch</span>
      </div>
      <div class="card-inner" id="quiz-view">
        <div class="intro">
          <div class="planet" aria-hidden="true">🪐</div>
          <div class="intro-copy">
            <p class="eyebrow">Mission control</p>
            <h1>Space Explorer Quiz</h1>
            <p>Ready to travel the universe?</p>
          </div>
        </div>

        <div class="status-row">
          <span id="question-count">Question 1 of 10</span>
          <span class="score" aria-live="polite"><span aria-hidden="true">⭐</span> Score: <span id="score">0</span></span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0">
          <div class="progress-fill" id="progress"></div>
        </div>

        <div id="question-area" aria-live="polite">
          <p class="question-number" id="question-label">Question 01</p>
          <h2 class="question" id="question">Loading question…</h2>
          <div class="answers" id="answers"></div>
          <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
          <div class="actions">
            <button class="primary" id="next" type="button" hidden>Next question <span aria-hidden="true">→</span></button>
          </div>
        </div>
      </div>

      <div class="result" id="result-view" hidden aria-live="polite">
        <div class="result-emoji" id="result-emoji" aria-hidden="true">🌟</div>
        <p class="eyebrow">Mission complete</p>
        <h2 id="result-title">Stellar work!</h2>
        <p class="result-copy" id="result-copy"></p>
        <div class="final-score"><span id="final-score">0</span><span>/ 10 correct</span></div>
        <button class="primary" id="restart" type="button"> <span aria-hidden="true">↻</span> Play again</button>
      </div>
    </section>
  </main>

  <script>
    const questions = [
      {
        question: "Which planet is known as the Red Planet?",
        answers: ["Venus", "Mars", "Jupiter", "Mercury"],
        correct: 1,
        fact: "Mars looks red because iron-rich dust on its surface has rusted."
      },
      {
        question: "What is the name of the galaxy that contains our Solar System?",
        answers: ["Andromeda Galaxy", "Whirlpool Galaxy", "Milky Way", "Sombrero Galaxy"],
        correct: 2,
        fact: "Our Solar System lives in the Milky Way, a barred spiral galaxy."
      },
      {
        question: "Which planet has the most prominent ring system?",
        answers: ["Saturn", "Neptune", "Earth", "Mars"],
        correct: 0,
        fact: "Saturn's spectacular rings are made mostly of ice and rocky debris."
      },
      {
        question: "What is the closest star to Earth?",
        answers: ["Sirius", "Proxima Centauri", "The Sun", "Polaris"],
        correct: 2,
        fact: "The Sun is our nearest star, about 150 million kilometres away."
      },
      {
        question: "Who was the first person to walk on the Moon?",
        answers: ["Yuri Gagarin", "Buzz Aldrin", "John Glenn", "Neil Armstrong"],
        correct: 3,
        fact: "Neil Armstrong stepped onto the lunar surface during Apollo 11 in 1969."
      },
      {
        question: "Which planet is the largest in our Solar System?",
        answers: ["Saturn", "Jupiter", "Uranus", "Neptune"],
        correct: 1,
        fact: "Jupiter is so large that more than 1,300 Earths could fit inside it."
      },
      {
        question: "What do astronauts wear to protect themselves outside a spacecraft?",
        answers: ["A pressure suit", "A thermal blanket", "A flight jacket", "A diving suit"],
        correct: 0,
        fact: "A spacesuit supplies oxygen and pressure while protecting against extreme temperatures."
      },
      {
        question: "What is the name of Earth's natural satellite?",
        answers: ["Titan", "Europa", "The Moon", "Phobos"],
        correct: 2,
        fact: "The Moon is Earth's only natural satellite and the fifth-largest moon in the Solar System."
      },
      {
        question: "Which planet is famous for its Great Red Spot?",
        answers: ["Mars", "Jupiter", "Saturn", "Venus"],
        correct: 1,
        fact: "Jupiter's Great Red Spot is a giant storm that has raged for centuries."
      },
      {
        question: "What force keeps planets in orbit around the Sun?",
        answers: ["Magnetism", "Friction", "Gravity", "Solar wind"],
        correct: 2,
        fact: "The Sun's gravity keeps the planets moving along their orbital paths."
      }
    ];

    const quizView = document.getElementById("quiz-view");
    const resultView = document.getElementById("result-view");
    const questionCount = document.getElementById("question-count");
    const questionLabel = document.getElementById("question-label");
    const questionText = document.getElementById("question");
    const answersElement = document.getElementById("answers");
    const feedback = document.getElementById("feedback");
    const nextButton = document.getElementById("next");
    const scoreElement = document.getElementById("score");
    const progress = document.getElementById("progress");
    const progressTrack = document.querySelector(".progress-track");
    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    function renderQuestion() {
      const item = questions[currentQuestion];
      questionCount.textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
      questionLabel.textContent = `Question ${String(currentQuestion + 1).padStart(2, "0")}`;
      questionText.textContent = item.question;
      answersElement.replaceChildren();
      feedback.textContent = "";
      feedback.className = "feedback";
      nextButton.hidden = true;
      answered = false;

      item.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "answer";
        button.innerHTML = `<span class="answer-letter">${String.fromCharCode(65 + index)}</span><span></span>`;
        button.lastElementChild.textContent = answer;
        button.addEventListener("click", () => selectAnswer(index, button));
        answersElement.append(button);
      });
    }

    function selectAnswer(selected, selectedButton) {
      if (answered) return;
      answered = true;
      const item = questions[currentQuestion];
      const buttons = [...answersElement.children];
      buttons.forEach(button => { button.disabled = true; });

      if (selected === item.correct) {
        score++;
        scoreElement.textContent = score;
        selectedButton.classList.add("correct");
        feedback.textContent = `✨ Correct! ${item.fact}`;
        feedback.classList.add("good");
      } else {
        selectedButton.classList.add("incorrect");
        buttons[item.correct].classList.add("correct");
        feedback.textContent = `Not quite! ${item.fact}`;
        feedback.classList.add("bad");
        quizView.classList.remove("shake");
        void quizView.offsetWidth;
        quizView.classList.add("shake");
      }

      const completed = currentQuestion + 1;
      progress.style.width = `${(completed / questions.length) * 100}%`;
      progressTrack.setAttribute("aria-valuenow", String(completed));
      nextButton.innerHTML = currentQuestion === questions.length - 1
        ? 'See results <span aria-hidden="true">✦</span>'
        : 'Next question <span aria-hidden="true">→</span>';
      nextButton.hidden = false;
      nextButton.focus();
    }

    function showResults() {
      quizView.hidden = true;
      resultView.hidden = false;
      document.getElementById("final-score").textContent = score;
      const reaction = score === 10
        ? ["🏆", "Out of this world!", "A perfect mission! You know your cosmos inside and out."]
        : score >= 7
          ? ["🚀", "Stellar work!", "You’re a true space explorer. The universe has a lot more to discover."]
          : score >= 4
            ? ["🌙", "Nice orbit!", "You’re building your cosmic knowledge. Ready for another launch?"]
            : ["🌱", "Future astronaut!", "Every great explorer starts somewhere. Take another trip through the stars!"];
      document.getElementById("result-emoji").textContent = reaction[0];
      document.getElementById("result-title").textContent = reaction[1];
      document.getElementById("result-copy").textContent = reaction[2];
      document.getElementById("restart").focus();
    }

    nextButton.addEventListener("click", () => {
      if (currentQuestion === questions.length - 1) {
        showResults();
        return;
      }
      currentQuestion++;
      renderQuestion();
      questionText.focus?.();
    });

    document.getElementById("restart").addEventListener("click", () => {
      currentQuestion = 0;
      score = 0;
      scoreElement.textContent = "0";
      progress.style.width = "0%";
      progressTrack.setAttribute("aria-valuenow", "0");
      quizView.hidden = false;
      resultView.hidden = true;
      renderQuestion();
      answersElement.firstElementChild.focus();
    });

    renderQuestion();
  </script>
</body>
</html>
